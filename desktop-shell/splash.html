<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
<style>
	html, body { margin: 0; height: 100%; background: #121218; color: #f2f2f5;
		font: 13px -apple-system, BlinkMacSystemFont, sans-serif; -webkit-app-region: drag; user-select: none; }
	body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
	img { width: 112px; height: 112px; }
	.title { font-size: 18px; font-weight: 700; }
	.status { color: #9a9aab; }
	.bar { width: 140px; height: 3px; border-radius: 3px; background: #2a2a35; overflow: hidden; }
	.bar::after { content: ""; display: block; width: 40%; height: 100%; background: #ffe14d;
		border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
	@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
</style>
</head>
<body>
	<img src="assets/icon.png" alt="" />
	<div class="title">Kutkap</div>
	<div class="bar"></div>
	<div class="status">Starting…</div>
</body>
</html>
